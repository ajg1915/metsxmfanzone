name = "metsxmfanzone-cron"
main = "worker.js"
compatibility_date = "2025-01-01"

# All cron expressions are UTC.
# Game window 19:00-03:00 UTC ≈ 3pm-11pm ET (Mets game hours).
[triggers]
crons = [
  "*/10 19-23,0-3 * * *",  # alerts + final scores during game window
  "0 * * * *",             # hourly pregame check
  "0 14 * * *",            # 10am ET morning alerts
  "0 18-23,0-3 * * *",     # lineup fetch during game window
  "0 6 * * *",             # daily standings update
  "0 12 * * *",            # daily news fetch
  "0 16 * * *",            # daily stream status sync
]

# Plain (non-secret) variable. Secrets are added separately via:
#   wrangler secret put SUPABASE_SERVICE_ROLE_KEY
#   wrangler secret put SUPABASE_ANON_KEY
#   wrangler secret put CRON_SHARED_SECRET
[vars]
SUPABASE_URL = "https://clwghkbtkofacsjeyrtk.supabase.co"
