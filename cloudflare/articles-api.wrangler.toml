# Deploy: npx wrangler deploy -c cloudflare/articles-api.wrangler.toml
name = "articles-api"
main = "articles-api-worker.js"
compatibility_date = "2026-11-01"
workers_dev = true

[[d1_databases]]
binding = "DB"
database_name = "metsxm-articles"
