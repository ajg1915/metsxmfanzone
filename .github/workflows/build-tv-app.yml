name: Build TV app

# Builds the Android TV / Fire TV app (tv-app/) and publishes it to the public "tv-app" release.
# Run it by hand from the Actions tab, or it runs when files in tv-app/ change.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tv-app/**"
      - ".github/workflows/build-tv-app.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: tv-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tv-app/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Install dependencies
        run: npm ci

      - name: Create Android project
        run: npx cap add android

      - name: Make it a TV app (launcher entry, banner, icons)
        run: |
          node scripts/patch-android.mjs
          pip install --quiet pillow
          python3 scripts/make_icons.py icons/tv-icon.png
          npx cap sync android

      - name: Set version (the site compares this to tell people an update is out)
        working-directory: tv-app/android/app
        run: |
          CODE=$((100 + ${{ github.run_number }}))
          echo "TV_CODE=$CODE" >> "$GITHUB_ENV"
          sed -i -E "s/versionCode [0-9]+/versionCode $CODE/" build.gradle
          sed -i -E "s/versionName \"[^\"]*\"/versionName \"1.0.$CODE\"/" build.gradle
          grep -E "versionCode|versionName" build.gradle

      # Same signing key on every build, so a new file installs over the old one (no "app conflict").
      - name: Restore the signing key
        id: keycache
        uses: actions/cache@v4
        with:
          path: tv-app/tv-signing.jks
          key: tv-signing-key-v1

      - name: Create the signing key (first time only)
        run: |
          if [ ! -s tv-signing.jks ]; then
            keytool -genkeypair -keystore tv-signing.jks -alias tv -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass mxfz-tv-sign -keypass mxfz-tv-sign -dname "CN=MetsXMFanZone TV, O=MetsXMFanZone, C=US"
          fi

      - name: Build APK
        working-directory: tv-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Sign and name the APK
        run: |
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          "$BT/zipalign" -f -p 4 android/app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          "$BT/apksigner" sign --ks tv-signing.jks --ks-key-alias tv --ks-pass pass:mxfz-tv-sign --key-pass pass:mxfz-tv-sign \
            --out MetsXMFanZone-TV.apk aligned.apk
          "$BT/apksigner" verify --print-certs MetsXMFanZone-TV.apk | head -3
          rm -f aligned.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MetsXMFanZone-TV
          path: tv-app/MetsXMFanZone-TV.apk

      - name: Publish to the tv-app release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete tv-app --cleanup-tag --yes || true
          gh release create tv-app MetsXMFanZone-TV.apk \
            --target "$GITHUB_SHA" \
            --title "MetsXMFanZone TV app" \
            --notes "Android TV and Fire TV app. Install with the Downloader app by entering metsxmfanzone.com/tv-app. Built from $GITHUB_SHA. versionCode=$TV_CODE"
