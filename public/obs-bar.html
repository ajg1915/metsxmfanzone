<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>MetsXMFanZone OBS bottom bar</title>
<!-- OBS: Sources > + > Browser. URL = this page (or Local file). Width 1920, Height 1080. Background is transparent. -->
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;background:transparent;overflow:hidden;font-family:Arial,Helvetica,sans-serif;color:#fff}
.bar{position:absolute;left:0;right:0;bottom:0;height:100px;background:linear-gradient(180deg,#1f5be0,#1240b8);border-top:4px solid #FF5910;display:flex;align-items:center}
.lg{position:absolute;left:8px;bottom:0;width:210px}
.lg video{display:block;width:210px;height:auto;filter:drop-shadow(0 6px 14px rgba(0,0,0,.55))}
.soc{position:absolute;left:250px;top:0;bottom:0;display:flex;align-items:center;gap:22px}
.ic{display:flex;gap:12px}
.ic i{width:44px;height:44px;border-radius:50%;background:#000;color:#fff;display:flex;align-items:center;justify-content:center;font:900 22px Arial,sans-serif;font-style:normal}
.ic i:nth-child(1){background:#fff;color:#1240b8}
.ic i:nth-child(3){background:linear-gradient(135deg,#f9a03f,#d6249f,#5851db)}
.ic i:nth-child(4){background:#ff0033}
.h{font:900 30px "Arial Black",Arial,sans-serif;letter-spacing:.08em;color:#FF5910;text-shadow:0 2px 0 rgba(0,0,0,.25)}
.dt{position:absolute;right:40px;top:0;bottom:0;display:flex;flex-direction:column;justify-content:center;align-items:flex-end}
.dt small{font:900 24px "Arial Black",Arial,sans-serif;letter-spacing:.12em;color:#FF5910}
.dt b{font:900 52px "Arial Black",Arial,sans-serif;line-height:1}
.dt b em{font-size:26px;font-style:normal;color:#cfe0ff;margin-left:8px}
</style></head><body>
<div class="bar">
  <div class="lg"><video src="stream-logo-animated.webm" autoplay loop muted playsinline></video></div>
  <div class="soc"><div class="ic"><i>f</i><i>&#9834;</i><i>&#9678;</i><i>&#9654;</i><i>X</i></div><div class="h">@METSXMFANZONE</div></div>
  <div class="dt"><small id="d">SUN, NOV 8</small><b><span id="t">1:35 PM</span><em>ET</em></b></div>
</div>
<script>
function tick(){
  var n=new Date();
  var d=new Intl.DateTimeFormat("en-US",{timeZone:"America/New_York",weekday:"short",month:"short",day:"numeric"}).format(n).replace(/,/g,"").toUpperCase().split(" ");
  document.getElementById("d").textContent=d[0]+", "+d[1]+" "+d[2];
  document.getElementById("t").textContent=new Intl.DateTimeFormat("en-US",{timeZone:"America/New_York",hour:"numeric",minute:"2-digit"}).format(n);
}
tick();setInterval(tick,1000);
</script></body></html>
