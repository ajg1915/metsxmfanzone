<script>
function tick(){
  var n=new Date();
  var d=new Intl.DateTimeFormat("en-US",{timeZone:"America/New_York",weekday:"short",month:"short",day:"numeric"}).format(n).replace(/,/g,"").toUpperCase().split(" ");
  document.getElementById("d").textContent=d[0]+", "+d[1]+" "+d[2];
  document.getElementById("t").textContent=new Intl.DateTimeFormat("en-US",{timeZone:"America/New_York",hour:"numeric",minute:"2-digit"}).format(n);
}
tick();setInterval(tick,1000);

var FEED="https://metsxmfanzone.com/api/blog-rss";
var FALLBACK=["Follow @METSXMFANZONE on every platform","Mets news, podcasts and live streams at metsxmfanzone.com"];
function setTicker(list){
  var tr=document.getElementById("tr"),h="";
  for(var i=0;i<list.length;i++){h+="<span>"+list[i].replace(/&/g,"&amp;").replace(/</g,"&lt;")+"</span>";}
  tr.innerHTML=h+h;
  var w=tr.scrollWidth/2;
  tr.style.animation="sc "+Math.max(20,Math.round(w/110))+"s linear infinite";
}
function loadNews(){
  fetch(FEED,{cache:"no-store"}).then(function(r){return r.text();}).then(function(x){
    var d=new DOMParser().parseFromString(x,"text/xml"),it=d.getElementsByTagName("item"),out=[];
    for(var i=0;i<it.length&&out.length<12;i++){var t=it[i].getElementsByTagName("title")[0];if(t&&t.textContent)out.push(t.textContent.trim());}
    setTicker(out.length?out:FALLBACK);
  }).catch(function(){ if(!document.getElementById("tr").innerHTML) setTicker(FALLBACK); });
}
