<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>MetsXMFanZone OBS bottom bar</title>
<!-- OBS: Sources > + > Browser. URL = this page (or Local file). Width 1280, Height 720 (any 16:9 size works: it scales itself). Background is transparent. -->
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;background:transparent;overflow:hidden;font-family:Arial,Helvetica,sans-serif;color:#fff}
.bar{position:absolute;left:0;right:0;bottom:0;height:100px;background:linear-gradient(180deg,#1f5be0,#1240b8);border-top:4px solid #FF5910;display:flex;align-items:center}
.lg{position:absolute;left:10px;bottom:0;width:140px}
.lg video{display:block;width:140px;height:auto;filter:drop-shadow(0 6px 14px rgba(0,0,0,.55))}
.soc{position:absolute;left:1300px;top:0;bottom:0;display:flex;flex-direction:column;justify-content:center;gap:8px}
.ic{display:flex;gap:12px}
.ic i{width:44px;height:44px;border-radius:50%;background:#000;color:#fff;display:flex;align-items:center;justify-content:center;font:900 22px Arial,sans-serif;font-style:normal}
.ic i:nth-child(1){background:#fff;color:#1240b8}
.ic i:nth-child(3){background:linear-gradient(135deg,#f9a03f,#d6249f,#5851db)}
.ic i:nth-child(4){background:#ff0033}
.h{font:900 22px "Arial Black",Arial,sans-serif;letter-spacing:.08em;color:#FF5910;text-shadow:0 2px 0 rgba(0,0,0,.25)}
.dt{position:absolute;right:40px;top:0;bottom:0;display:flex;flex-direction:column;justify-content:center;align-items:flex-end}
.dt small{font:900 24px "Arial Black",Arial,sans-serif;letter-spacing:.12em;color:#FF5910}
.dt b{font:900 52px "Arial Black",Arial,sans-serif;line-height:1}
.dt b em{font-size:26px;font-style:normal;color:#cfe0ff;margin-left:8px}
.news{position:absolute;left:176px;width:1100px;top:0;bottom:0;display:flex;align-items:center;gap:18px}
.news .lab{flex:none;background:#FF5910;border-radius:10px;padding:9px 16px;font:900 22px "Arial Black",Arial,sans-serif;letter-spacing:.05em;white-space:nowrap;box-shadow:0 3px 0 rgba(0,0,0,.25)}
.news .vp{flex:1;overflow:hidden;white-space:nowrap;mask-image:linear-gradient(90deg,transparent,#000 3%,#000 97%,transparent)}
.news .tr{display:inline-block;font:600 36px Arial,Helvetica,sans-serif;will-change:transform}
.news .tr span{margin-right:70px}
@keyframes sc{from{transform:translateX(0)}to{transform:translateX(-50%)}}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0}
</style></head><body>
<div id="stage">
<div class="bar">
  <div class="lg"><video src="stream-logo-animated.webm" autoplay loop muted playsinline></video></div>
  <div class="news"><div class="lab">METSXMFANZONE NEWS</div><div class="vp"><div class="tr" id="tr"></div></div></div>
  <div class="soc"><div class="ic"><i>f</i><i>&#9834;</i><i>&#9678;</i><i>&#9654;</i><i>X</i></div><div class="h">@METSXMFANZONE</div></div>
  <div class="dt"><small id="d">SUN, NOV 8</small><b><span id="t">1:35 PM</span><em>ET</em></b></div>
</div>
</div>
<script>
function tick(){
  var n=new Date();
  var d=new Intl.DateTimeFormat("en-US",{timeZone:"America/New_York",weekday:"short",month:"short",day:"numeric"}).format(n).replace(/,/g,"").toUpperCase().split(" ");
  document.getElementById("d").textContent=d[0]+", "+d[1]+" "+d[2];
  document.getElementById("t").textContent=new Intl.DateTimeFormat("en-US",{timeZone:"America/New_York",hour:"numeric",minute:"2-digit"}).format(n);
}
tick();setInterval(tick,1000);

var FEED="https://metsxmfanzone.com/api/blog-rss";
var FALLBACK=["Follow @METSXMFANZONE on every platform","Mets news, podcasts and live streams at metsxmfanzone.com"];
function setTicker(list){
  var tr=document.getElementById("tr"),h="";
  for(var i=0;i<list.length;i++){h+="<span>"+list[i].replace(/&/g,"&amp;").replace(/</g,"&lt;")+"</span>";}
  tr.innerHTML=h+h;
  var w=tr.scrollWidth/2;
  tr.style.animation="sc "+Math.max(20,Math.round(w/110))+"s linear infinite";
}
function loadNews(){
  fetch(FEED,{cache:"no-store"}).then(function(r){return r.text();}).then(function(x){
    var d=new DOMParser().parseFromString(x,"text/xml"),it=d.getElementsByTagName("item"),out=[];
    for(var i=0;i<it.length&&out.length<12;i++){var t=it[i].getElementsByTagName("title")[0];if(t&&t.textContent)out.push(t.textContent.trim());}
    setTicker(out.length?out:FALLBACK);
  }).catch(function(){ if(!document.getElementById("tr").innerHTML) setTicker(FALLBACK); });
}
setTicker(FALLBACK);loadNews();setInterval(loadNews,600000);
function fit(){var k=Math.min(innerWidth/1920,innerHeight/1080);document.getElementById("stage").style.transform="scale("+k+")";}
fit();addEventListener("resize",fit);
</script></body></html>
